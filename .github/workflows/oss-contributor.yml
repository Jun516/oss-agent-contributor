name: OSS Contributor (autonomous)

# Automatic scheduled runs have been disabled at the user's request.
# Manual dispatch remains available; publishing is paused independently.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oss-contributor
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_candidate: ${{ steps.select.outputs.has_candidate }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 pinned
        with:
          python-version: '3.12'
      - name: Discover qualified public issue (no repository writes)
        env:
          GITHUB_TOKEN: ${{ secrets.OSS_DISCOVERY_TOKEN || github.token }}
        run: python -m oss_contributor.core discover --out scan.json
      - id: select
        name: Set candidate flag
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          obj = json.load(open('scan.json', encoding='utf-8'))
          print('has_candidate=' + str(obj['candidate'] is not None).lower())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned
        if: always()
        with:
          name: scan-report
          path: scan.json
          retention-days: 14

  propose:
    needs: discover
    if: ${{ needs.discover.outputs.has_candidate == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: scan-report
      - name: Require a currently unclaimed issue and unchanged baseline
        env:
          GITHUB_TOKEN: ${{ secrets.OSS_DISCOVERY_TOKEN || github.token }}
        run: |
          python -m oss_contributor.core preflight --candidate scan.json
          python -m oss_contributor.core checkout --candidate scan.json --target target
          python -m oss_contributor.core prompt --candidate scan.json --out prompt.md
      - name: Prepare smallest possible fix (NO external GitHub write token)
        uses: openai/codex-action@a8d8be6ee028bea4525bc722d16f36687b408c81 # pinned Oct 18 2026
        with:
          prompt-file: ${{ github.workspace }}/prompt.md
          working-directory: target
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          allow-bots: true
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
      - name: Collect inspected patch and exact test commands
        shell: bash
        run: |
          if [ -f target/verification.json ]; then
            cp target/verification.json verification.json
            rm target/verification.json
          fi
          python -m oss_contributor.core collect --candidate scan.json --repo target --checks verification.json --out bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: proposed-patch
          path: bundle/
          retention-days: 14
          if-no-files-found: error

  verify:
    needs: propose
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: proposed-patch
          path: bundle
      - name: Prepare testing CLIs (unprivileged, no publish token)
        run: |
          python -m pip install --disable-pip-version-check pytest uv
          corepack enable || true
      - name: Replay patch and independently run declared focused tests
        run: python -m oss_contributor.core verify --bundle bundle --target replay --report report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: test-report
          path: report.json
          retention-days: 14
          if-no-files-found: warn

  review:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: proposed-patch
          path: bundle
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: test-report
          path: .
      - name: Prepare independent read-only diff review
        run: python -m oss_contributor.review prepare --bundle bundle --verification report.json --target review-source --prompt reviewer-prompt.md
      - name: Independent Codex code review (NO publish token)
        uses: openai/codex-action@a8d8be6ee028bea4525bc722d16f36687b408c81
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          allow-bots: true
          working-directory: review-source
          prompt-file: ${{ github.workspace }}/reviewer-prompt.md
          output-schema-file: ${{ github.workspace }}/policies/review.schema.json
          output-file: ${{ github.workspace }}/review-verdict.json
      - name: Gate on approved LOW risk with exact verified evidence
        run: python -m oss_contributor.review gate --bundle bundle --verification report.json --verdict review-verdict.json --out review-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: review-report
          path: review-report.json
          retention-days: 14
          if-no-files-found: warn

  publish:
    # Preauthorized by Jun516. Pause instantly with repository var PAUSE_AUTOPUBLISH=true.
    # Only the publish job receives OSS_BOT_TOKEN; no target code runs here.
    needs: [verify, review]
    if: ${{ needs.verify.result == 'success' && needs.review.result == 'success' && vars.PAUSE_AUTOPUBLISH != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: proposed-patch
          path: bundle
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: test-report
          path: .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: review-report
          path: .
      - name: Preauthorized Fork, commit, push and create ONE PR
        env:
          GH_TOKEN: ${{ secrets.OSS_BOT_TOKEN }}
        run: python -m oss_contributor.publisher --bundle bundle --verification report.json --review review-report.json --out publication.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: publication-report
          path: publication.json
          retention-days: 30
          if-no-files-found: warn
